<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveWise - Free Video Downloader</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #f8fafc;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 50px;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }
        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 12px 20px;
            font-size: 16px;
        }
        .input-group button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-group button:hover {
            background: #0ea5e9;
            transform: scale(1.02);
        }
        .result-box {
            margin-top: 30px;
            display: none;
            background: #0f172a;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #334155;
            text-align: left;
        }
        .result-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #f8fafc;
            word-break: break-all;
        }
        .download-btn {
            display: block;
            width: 100%;
            background: #22c55e;
            color: #fff;
            text-align: center;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background: #16a34a;
        }
        .loading {
            display: none;
            margin-top: 25px;
            color: #38bdf8;
            font-size: 16px;
        }
        .error-msg {
            display: none;
            margin-top: 25px;
            color: #ef4444;
            font-size: 15px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        @media(max-width: 600px) {
            .input-group { flex-direction: column; border-radius: 15px; }
            .input-group button { border-radius: 10px; }
            .main-container { margin: 20px; padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-download"></i> SaveWise</div>
    </header>

    <div class="main-container">
        <h1>YouTube Video Downloader</h1>
        <p class="subtitle">Download videos quickly and easily in high quality.</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube video link here...">
            <button onclick="fetchVideo()">Download</button>
        </div>

        <div class="loading" id="loadingText">
            <i class="fa-solid fa-spinner fa-spin"></i> Processing video, please wait...
        </div>

        <div class="error-msg" id="errorMsg">
            Failed to fetch video. Please check the URL and try again.
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-title" id="resTitle">Video Ready</div>
            <a id="downloadLink" href="#" class="download-btn" target="_blank">Download File</a>
        </div>
    </div>

    <footer>
        &copy; 2025 SaveWise. All rights reserved.
    </footer>

    <script>
        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loadingText');
            const errorMsg = document.getElementById('errorMsg');
            const resultBox = document.getElementById('resultBox');
            const downloadLink = document.getElementById('downloadLink');
            const resTitle = document.getElementById('resTitle');

            if (!urlInput) {
                alert('Please enter a valid video URL');
                return;
            }

            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            resultBox.style.display = 'none';

            try {
                // Using Cobalt free public API
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: urlInput
                    })
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (data.status === 'stream' || data.status === 'redirect' || data.url) {
                    downloadLink.href = data.url;
                    resTitle.innerText = "Your video is ready to download!";
                    resultBox.style.display = 'block';
                } else if (data.status === 'picker' && data.picker && data.picker.length > 0) {
                    downloadLink.href = data.picker[0].url;
                    resTitle.innerText = "Your video is ready to download!";
                    resultBox.style.display = 'block';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                loading.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
