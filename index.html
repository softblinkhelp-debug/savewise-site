<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveWise - Free Video Downloader</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .main-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #f8fafc;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            background: #0f172a;
            padding: 8px;
            border-radius: 50px;
            border: 1px solid #334155;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 12px 20px;
            font-size: 16px;
        }
        .input-group button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-group button:hover {
            background: #0ea5e9;
            transform: scale(1.02);
        }
        .widget-container {
            margin-top: 20px;
            background: #0f172a;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid #334155;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        iframe {
            width: 100%;
            height: 90px;
            border: none;
            background: transparent;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        @media(max-width: 600px) {
            .input-group { flex-direction: column; border-radius: 15px; }
            .input-group button { border-radius: 10px; }
            .main-container { margin: 20px; padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-download"></i> SaveWise</div>
    </header>

    <div class="main-container">
        <h1>YouTube Video Downloader</h1>
        <p class="subtitle">Paste your video link below to download instantly in MP4 & MP3.</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube video link here...">
            <button onclick="loadDownloader()">Generate Download</button>
        </div>

        <div class="widget-container" id="widgetBox">
            <p style="color: #64748b; font-size: 14px;">Your download button will appear here once you enter a link.</p>
        </div>
    </div>

    <footer>
        &copy; 2025 SaveWise. All rights reserved.
    </footer>

    <script>
        function loadDownloader() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const widgetBox = document.getElementById('widgetBox');

            if (!urlInput) {
                alert('Please enter a valid video URL');
                return;
            }

            // Encode the URL for the embed widget
            const encodedUrl = encodeURIComponent(urlInput);
            
            // Render official downloader embed widget
            widgetBox.innerHTML = `
                <iframe src="https://loader.to/api/button/?url=${encodedUrl}&color=38bdf8" scrolling="no"></iframe>
            `;
        }
    </script>
</body>
</html>
